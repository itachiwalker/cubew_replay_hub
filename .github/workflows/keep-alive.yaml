name: Keep Supabase Alive
on:
  schedule:
    - cron: '0 3 */3 * *'  # 3日に1回
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping replay hub
        run: |
          curl -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/get_replay" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"p_hash":"0000000000000000"}' > /dev/null 2>&1
